<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiosk · {{ org_name }}</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  <style nonce="{{ csp_nonce() }}">
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;background:#000;color:#fff;
              font-family:'Inter',sans-serif}
    .kiosk{
      position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;
      background:
        radial-gradient(900px 600px at 80% 10%, rgba(99,102,241,0.35),transparent 60%),
        radial-gradient(700px 600px at 10% 80%, rgba(16,185,129,0.25),transparent 60%),
        linear-gradient(180deg,#0b1224 0%,#000 100%);
    }
    .top{display:flex;align-items:center;justify-content:space-between;padding:18px 28px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.6rem}
    .brand-mark{
      width:46px;height:46px;border-radius:12px;
      background:linear-gradient(135deg,#6366f1,#a855f7);
      display:flex;align-items:center;justify-content:center;
    }
    .clock{font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;letter-spacing:0.02em}
    .clock small{display:block;font-size:0.85rem;color:#94a3b8;font-weight:500;text-align:right}

    .stage{
      position:relative;display:grid;
      grid-template-columns: 1.4fr 1fr;
      gap:22px;padding:20px 28px;align-items:stretch;
    }
    .video-pane{
      position:relative;border-radius:24px;overflow:hidden;
      background:#0a0f1f;border:2px solid rgba(99,102,241,0.4);
      display:flex;align-items:center;justify-content:center;
    }
    .video-pane img{width:100%;height:100%;object-fit:cover;display:block}
    .video-corner{
      position:absolute;top:16px;left:16px;
      display:inline-flex;align-items:center;gap:8px;
      background:rgba(0,0,0,0.55);color:#fecaca;
      padding:6px 14px;border-radius:999px;
      font-weight:700;letter-spacing:0.12em;font-size:0.85rem;
      border:1px solid rgba(239,68,68,0.4)
    }
    .rec-dot{width:10px;height:10px;border-radius:50%;background:#ef4444;
      animation:pulse 1.4s infinite;box-shadow:0 0 0 0 rgba(239,68,68,0.5)}
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(239,68,68,0.5)}
      70%{box-shadow:0 0 0 10px rgba(239,68,68,0)}
      100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}
    }

    .info-pane{
      display:flex;flex-direction:column;gap:14px;justify-content:space-between;
    }
    .welcome-card{
      flex:1;background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:24px;padding:36px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;position:relative;overflow:hidden;
    }
    .welcome-hello{
      font-size:1rem;color:#94a3b8;letter-spacing:0.18em;text-transform:uppercase;
      margin-bottom:12px;
    }
    .welcome-name{
      font-size:3rem;font-weight:800;line-height:1.1;
      background:linear-gradient(135deg,#fff,#c7d2fe);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .welcome-meta{font-size:1.1rem;color:#cbd5e1;margin-top:10px}
    .welcome-thumb{
      width:160px;height:160px;border-radius:50%;
      object-fit:cover;border:5px solid rgba(165,180,252,0.4);
      box-shadow:0 20px 50px -10px rgba(99,102,241,0.5);
      margin-bottom:20px;
    }
    .welcome-card .placeholder{
      width:160px;height:160px;border-radius:50%;
      background:rgba(255,255,255,0.05);
      display:flex;align-items:center;justify-content:center;
      margin-bottom:20px;
    }
    .welcome-card .placeholder i{font-size:80px;color:#475569}
    .welcome-card.success{
      border:2px solid rgba(16,185,129,0.6);
      background:linear-gradient(135deg,rgba(16,185,129,0.2),rgba(99,102,241,0.18));
      animation:flash 1.6s ease;
    }
    @keyframes flash{
      0%{transform:scale(0.96);opacity:0.6}
      40%{transform:scale(1.02);opacity:1}
      100%{transform:scale(1);opacity:1}
    }

    .stats{
      display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
    }
    .stat{
      background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);
      border-radius:18px;padding:18px 20px;
    }
    .stat .lbl{font-size:0.78rem;letter-spacing:0.1em;color:#94a3b8;text-transform:uppercase}
    .stat .val{font-size:2.2rem;font-weight:800;line-height:1.1;color:#f1f5f9;margin-top:4px}
    .stat .val small{font-size:0.9rem;color:#94a3b8;margin-left:4px}

    .bottom{
      padding:16px 28px;display:flex;justify-content:space-between;align-items:center;
      border-top:1px solid rgba(255,255,255,0.06);color:#94a3b8;font-size:0.92rem;
    }
    .bottom a{color:#cbd5e1;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
    .bottom a:hover{color:#fff}
  </style>
</head>
<body>
<div class="kiosk">

  <div class="top">
    <div class="brand">
      <div class="brand-mark"><i class="material-icons" style="color:white">face_retouching_natural</i></div>
      <span>{{ org_name }}</span>
    </div>
    <div class="clock">
      <span id="clock">--:--:--</span>
      <small id="dateStr"></small>
    </div>
  </div>

  <div class="stage">
    <div class="video-pane">
      <img id="vid" alt="">
      <div class="video-corner"><span class="rec-dot"></span> LIVE · KIOSK</div>
    </div>

    <div class="info-pane">
      <div class="welcome-card" id="welcomeCard">
        <div class="placeholder" id="placeholder"><i class="material-icons">face</i></div>
        <img class="welcome-thumb" id="thumb" style="display:none">
        <div class="welcome-hello" id="hello">Look at the camera</div>
        <div class="welcome-name" id="name">Ready</div>
        <div class="welcome-meta" id="meta">Attendance system is online</div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="lbl">Present today</div>
          <div class="val" id="present">0</div>
        </div>
        <div class="stat">
          <div class="lbl">Late today</div>
          <div class="val" id="late">0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <span>Show your face to the camera. Recognition is automatic.</span>
    <a href="{{ url_for('home') }}"><i class="material-icons" style="font-size:18px">arrow_back</i> Exit kiosk</a>
  </div>
</div>

<script nonce="{{ csp_nonce() }}">
  // ─── Clock ───
  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent =
      d.toLocaleTimeString([], { hour12:false });
    document.getElementById('dateStr').textContent =
      d.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });
  }
  setInterval(tick, 1000); tick();

  // ─── Start recognition automatically ───
  (async function start() {
    try {
      const r = await fetch('/start_recognise', { method: 'POST' });
      const j = await r.json();
      if (j.ok) {
        document.getElementById('vid').src = '/video_feed?ts=' + Date.now();
      } else {
        document.getElementById('name').textContent = 'No model trained';
        document.getElementById('meta').textContent = j.msg || '';
      }
    } catch(e) {}
  })();

  // ─── Sound ───
  let audioCtx = null;
  function beep(freq=880, ms=120, vol=0.18) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      setTimeout(() => { o.stop(); }, ms);
    } catch (e) {}
  }
  // unlock audio on first user gesture
  document.body.addEventListener('click', () => beep(0, 1, 0), { once: true });

  // ─── Poll captured events ───
  const announced = new Set();
  const card = document.getElementById('welcomeCard');
  const hello = document.getElementById('hello');
  const nameEl = document.getElementById('name');
  const meta = document.getElementById('meta');
  const thumb = document.getElementById('thumb');
  const placeholder = document.getElementById('placeholder');

  let resetTimer = null;
  function showWelcome(c){
    card.classList.add('success');
    hello.textContent = 'Welcome';
    nameEl.textContent = c.name;
    meta.textContent  = (c.department || '') + ' · marked at ' +
                        new Date().toLocaleTimeString([], { hour12:false });
    thumb.src = '/static/profiles/' + c.person_id + '.jpg';
    thumb.style.display = 'block';
    placeholder.style.display = 'none';
    beep(880, 100); setTimeout(() => beep(1320, 140), 110);
    if (resetTimer) clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      card.classList.remove('success');
      hello.textContent = 'Look at the camera';
      nameEl.textContent = 'Ready';
      meta.textContent  = 'Attendance system is online';
      thumb.style.display = 'none'; thumb.removeAttribute('src');
      placeholder.style.display = 'flex';
    }, 4500);
  }

  async function pollCap(){
    try {
      const j = await (await fetch('/api/just_captured')).json();
      (j.captured || []).forEach(c => {
        const key = c.person_id + '|' + new Date().toISOString().slice(0,16);
        if (announced.has(key)) return;
        announced.add(key);
        showWelcome(c);
      });
    } catch(e){}
  }
  async function pollStats(){
    try {
      const j = await (await fetch('/api/stats')).json();
      document.getElementById('present').textContent = j.present_today;
      document.getElementById('late').textContent = j.late_today;
    } catch(e){}
  }
  setInterval(pollCap, 700);
  setInterval(pollStats, 5000); pollStats();
</script>
</body>
</html>
