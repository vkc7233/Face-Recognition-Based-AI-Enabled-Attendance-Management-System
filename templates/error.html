<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} · {{ org_name or 'FaceMark' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
  <style nonce="{{ csp_nonce() }}">
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      background:
        radial-gradient(900px 600px at 80% 10%, rgba(99,102,241,0.30), transparent 60%),
        radial-gradient(700px 600px at 10% 80%, rgba(168,85,247,0.18), transparent 60%),
        linear-gradient(180deg, #060914, #0b1224);
      color: #e2e8f0; font-family: 'Inter', sans-serif;
    }
    .err {
      max-width: 520px; padding: 32px 28px;
      text-align: center;
    }
    .err-code {
      font-size: 6rem; font-weight: 800; letter-spacing: -0.04em;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1;
    }
    .err h2 { font-weight: 800; letter-spacing: -0.02em; margin-top: 8px; }
    .err p { color: #94a3b8; }
    .req-id {
      display: inline-block; margin-top: 16px;
      font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
      padding: 4px 10px; border-radius: 8px;
      background: rgba(255,255,255,0.06); color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white; text-decoration: none; font-weight: 700;
      margin-top: 20px;
      box-shadow: 0 12px 30px -10px rgba(99,102,241,0.55);
    }
  </style>
</head>
<body>
  <div class="err">
    <div class="err-code">{{ code }}</div>
    <h2>{{ title }}</h2>
    <p>{{ detail }}</p>
    <a href="/" class="btn-back">
      <i class="material-icons-outlined" style="font-size:18px;">arrow_back</i>
      Back to dashboard
    </a>
    {% if request_id %}<div class="req-id">request id · {{ request_id }}</div>{% endif %}
  </div>
</body>
</html>
